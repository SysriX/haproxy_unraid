# HAProxy 3.4 – zentraler Eingang für außen (Firewall leitet WAN 80/443 auf <IP_HAProxy>)
# und innen (interner DNS zeigt die Namen auf <IP_HAProxy>, ersetzt einen bisherigen Reverse-Proxy).
# Adressen dieses Netzes kommen aus den Variablen der Unraid-Vorlage (z. B. "${CW_IP}"), nicht von hier.
#
# NICHT direkt in aktiv/ ändern: in bearbeiten/ ändern, dann
#   docker exec haproxy-unraid hap-uebernehmen
# (prüft, übernimmt, lädt neu und springt bei Fehlern automatisch zurück).
#
# Dienste stehen in listen/dienste.map (Name -> Backend:Zugang:Modus) und dienste.cfg (Backends).
# Jede Anfrage wird als JSON geloggt (Docker-Log + Home Assistant access_monitor) –
# mit "aktion" (durchgelassen/abgelehnt/...) und bei Ablehnung "grund".

global
    log stdout format raw local0 info
    log "${HA_SYSLOG}" format raw local0 info
    stats socket /tmp/haproxy.sock mode 600 level admin expose-fd listeners
    stats timeout 30s
    # Master läuft als root (liest Zertifikate, bindet Ports), die Arbeitsprozesse ohne Rechte
    user haproxy
    group haproxy
    # relative Pfade (listen/, ../certs/) gelten ab dem Ordner dieser Datei
    default-path config
    maxconn 4000
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log     global
    option  dontlognull
    timeout connect      5s
    timeout client       60s
    timeout server       60s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel       1h
    timeout client-fin   10s
    default-server inter 10s fall 3 rise 2

# ---------------------------------------------------------------------------
# Zähler je Quell-IP (nur externe Adressen werden gezählt)
#   conn_rate  : Verbindungen / 10 s      http_req_rate : Anfragen / 10 s
#   http_err_rate : Fehlerantworten (4xx, z. B. falsches Passwort) / 60 s
#   gpc0 > 0   : automatisch gesperrt, bis die IP 15 min Ruhe gibt
# ---------------------------------------------------------------------------
backend st_quelle
    stick-table type ipv6 size 200k expire 15m store conn_rate(10s),http_req_rate(10s),http_err_rate(60s),gpc0

# ---------------------------------------------------------------------------
# Statistik + Prometheus – nur aus internen Netzen (Firewall leitet 8404 nicht weiter)
# Home Assistant liest /;csv für den Zustand der Dienste.
# ---------------------------------------------------------------------------
frontend stats
    bind :8404
    mode http
    no log
    http-request deny unless { src -f listen/intern-netze.lst }
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends
    stats auth "admin:${STATS_PASS}"

# ---------------------------------------------------------------------------
# Port 80: Let's-Encrypt-Prüfung (HTTP-01) für ALLE Namen an Cert Warden,
# egal bei welchem DNS-Anbieter (STRATO, Hetzner, ...) die Domain liegt.
# Alles andere: Umleitung auf https.
# ---------------------------------------------------------------------------
frontend fe_http
    bind :80
    mode http
    log-format '{"q":"hap","fe":"%f","ci":"%ci","cp":%cp,"host":"%[var(txn.host),json(utf8s)]","m":"%HM","pfad":"%[var(txn.pfad),json(utf8s)]","st":%ST,"b":"%b","s":"%s","by":%B,"ta":%Ta,"ts":"%tsc","aktion":"%[var(txn.aktion)]","grund":"%[var(txn.grund)]","ua":"%[var(txn.ua),json(utf8s)]"}'
    acl intern    src -f listen/intern-netze.lst
    acl acme      path_beg /.well-known/acme-challenge/
    acl hat_grund var(txn.grund) -m found

    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request set-var(txn.pfad) path
    http-request set-var(txn.ua)   req.fhdr(user-agent)

    http-request set-var(txn.aktion) str(acme) if acme
    http-request set-var(txn.grund)  str(sperrliste) if !acme !intern { src -f listen/sperrliste.lst }
    http-request set-var(txn.aktion) str(abgelehnt)  if hat_grund
    http-request deny deny_status 403 if hat_grund
    http-request set-var(txn.aktion) str(umleitung)  if !acme
    http-request redirect scheme https code 301 if !acme
    use_backend be_certwarden_http01 if acme

backend be_certwarden_http01
    mode http
    server certwarden "${CW_IP}:4060" check

# ---------------------------------------------------------------------------
# Port 443, Stufe 1 (TCP): Name (SNI) lesen und entscheiden
#   Modus "durch": verschlüsselt an den Dienst durchreichen (z. B. grommunio)
#   Modus "tls"  : an Stufe 2 – HAProxy beendet TLS selbst (Zertifikat aus Cert Warden)
#   unbekannter Name / kein TLS / gesperrt: Verbindung schließen (mit Grund im Log)
# ---------------------------------------------------------------------------
frontend fe_https
    bind :443
    mode tcp
    log-format '{"q":"hap","fe":"%f","ci":"%ci","cp":%cp,"sni":"%[var(sess.sni),json(utf8s)]","b":"%b","s":"%s","by":%B,"ta":%Tt,"ts":"%ts","aktion":"%[var(sess.aktion)]","grund":"%[var(sess.grund)]"}'
    tcp-request inspect-delay 5s
    acl intern     src -f listen/intern-netze.lst
    acl hat_grund  var(sess.grund) -m found
    acl bekannt    var(sess.dienst) -m found
    acl durch      var(sess.dienst),field(3,:) -m str durch
    acl nur_intern var(sess.dienst),field(2,:) -m str intern

    tcp-request content track-sc0 src table st_quelle if !intern
    # wartet bis zu 5 s auf die TLS-Begrüßung
    tcp-request content set-var(sess.grund)  str(kein_tls) if !{ req.ssl_hello_type 1 }
    tcp-request content set-var(sess.sni)    req.ssl_sni,lower
    tcp-request content set-var(sess.dienst) req.ssl_sni,lower,map(listen/dienste.map)

    tcp-request content set-var(sess.grund) str(sperrliste)            if !hat_grund !intern { src -f listen/sperrliste.lst }
    tcp-request content set-var(sess.grund) str(auto_sperre)           if !hat_grund !intern { sc0_get_gpc0 gt 0 }
    tcp-request content set-var(sess.grund) str(zu_viele_verbindungen) if !hat_grund !intern { sc0_conn_rate gt 100 }
    tcp-request content set-var(sess.grund) str(kein_name)             if !hat_grund !{ var(sess.sni) -m found }
    tcp-request content set-var(sess.grund) str(unbekannter_name)      if !hat_grund !bekannt
    tcp-request content set-var(sess.grund) str(nur_intern)            if !hat_grund nur_intern !intern
    tcp-request content set-var(sess.aktion) str(abgelehnt) if hat_grund
    tcp-request content reject if hat_grund

    tcp-request content set-var(sess.aktion) str(durchgereicht) if durch
    tcp-request content set-var(sess.aktion) str(tls_ende)      if !durch
    tcp-request content set-var(sess.be)     var(sess.dienst),field(1,:) if durch
    use_backend %[var(sess.be)] if durch
    default_backend be_tls_ende

# Übergabe an Stufe 2 – PROXY-Protokoll behält die echte Quell-IP
backend be_tls_ende
    mode tcp
    server tls 127.0.0.1:8443 send-proxy-v2

# ---------------------------------------------------------------------------
# Port 443, Stufe 2 (HTTP): TLS beenden, Name (Host) prüfen, weiterleiten
# Zertifikate: ../certs/*.pem (cert-pull.sh aus Cert Warden); HAProxy wählt per Name.
# ---------------------------------------------------------------------------
frontend fe_tls
    bind 127.0.0.1:8443 accept-proxy ssl crt ../certs/ alpn h2,http/1.1
    mode http
    log-format '{"q":"hap","fe":"%f","ci":"%ci","cp":%cp,"host":"%[var(txn.host),json(utf8s)]","m":"%HM","pfad":"%[var(txn.pfad),json(utf8s)]","st":%ST,"b":"%b","s":"%s","by":%B,"ta":%Ta,"ts":"%tsc","aktion":"%[var(txn.aktion)]","grund":"%[var(txn.grund)]","ua":"%[var(txn.ua),json(utf8s)]","tls":"%sslv"}'
    option forwardfor
    acl intern     src -f listen/intern-netze.lst
    acl hat_grund  var(txn.grund) -m found
    acl bekannt    var(txn.dienst) -m found
    acl nur_intern var(txn.dienst),field(2,:) -m str intern
    acl ist_tls    var(txn.dienst),field(3,:) -m str tls

    http-request set-var(txn.host)   req.hdr(host),field(1,:),lower
    http-request set-var(txn.pfad)   path
    http-request set-var(txn.ua)     req.fhdr(user-agent)
    http-request set-var(txn.dienst) var(txn.host),map(listen/dienste.map)
    http-request track-sc0 src table st_quelle if !intern

    http-request set-var(txn.grund) str(auto_sperre)       if !intern { sc0_get_gpc0 gt 0 }
    http-request set-var(txn.grund) str(unbekannter_name)  if !hat_grund !bekannt
    http-request set-var(txn.grund) str(unbekannter_name)  if !hat_grund !ist_tls
    http-request set-var(txn.grund) str(nur_intern)        if !hat_grund nur_intern !intern
    http-request set-var(txn.grund) str(scanner)           if !hat_grund !intern { path_beg -i -f listen/scanner-pfade.lst }
    http-request set-var(txn.grund) str(zu_viele_anfragen) if !hat_grund !intern { sc0_http_req_rate gt 300 }
    http-request set-var(txn.grund) str(zu_viele_fehler)   if !hat_grund !intern { sc0_http_err_rate gt 50 }
    # Scanner und Dauer-Fehler (z. B. Passwort-Raten) sperren die IP automatisch
    http-request sc-inc-gpc0(0) if { var(txn.grund) -m str scanner zu_viele_fehler }
    http-request set-var(txn.aktion) str(abgelehnt) if hat_grund
    http-request deny deny_status 404 if { var(txn.grund) -m str unbekannter_name }
    http-request deny deny_status 429 if { var(txn.grund) -m str zu_viele_anfragen zu_viele_fehler }
    http-request deny deny_status 403 if hat_grund

    http-request set-var(txn.aktion) str(durchgelassen)
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Real-IP %[src]
    use_backend %[var(txn.dienst),field(1,:)]
