# Backends = die Ziele hinter HAProxy. Jedes Backend, das in listen/dienste.map steht,
# muss hier existieren (hap-uebernehmen prüft das, auch den passenden Modus).
#
#   Modus "tls"   in dienste.map -> hier "mode http"  (HAProxy beendet TLS)
#   Modus "durch" in dienste.map -> hier "mode tcp"   (verschlüsselt durchgereicht)
#
# <IP_...> in den Beispielen durch die Adresse des Ziels in diesem Netz ersetzen.
# "${CW_IP}" kommt aus der Variable CW_IP der Unraid-Vorlage.
#
# "check" = Gesundheitsprüfung alle 10 s; fällt ein Dienst aus, sieht man das in
# Home Assistant (binary_sensor.haus_net_proxy_<backend>) und HAProxy antwortet 503.

# --- Cert Warden Oberfläche (nur intern, durchgereicht: Cert Warden hat eigenes Zertifikat)
backend be_certwarden
    mode tcp
    server certwarden "${CW_IP}:4055" check

# --- grommunio (durchgereicht; grommunio hat sein Zertifikat selbst) ---------
# backend be_grommunio
#     mode tcp
#     timeout server 1h
#     server grommunio <IP_grommunio>:443 check

# --- Nextcloud (HAProxy beendet TLS, Nextcloud spricht intern http) ----------
# In Nextcloud config.php:  'trusted_proxies' => ['<IP_HAProxy>'],
#                           'overwriteprotocol' => 'https',
# backend be_nextcloud
#     mode http
#     option httpchk GET /status.php
#     http-check expect status 200
#     http-request set-header X-Forwarded-Port 443
#     # große Uploads / lange Synchronisation
#     timeout server 1h
#     server nextcloud <IP_Nextcloud>:80 check

# --- Webseiten eines bisherigen nginx (nginx bleibt nur noch Webserver, ohne TLS)
# backend be_web
#     mode http
#     option httpchk GET /
#     server nginx <IP_Webserver>:80 check

# --- Ziel, das selbst nur https kann (z. B. Unraid-Oberfläche) --------------
# backend be_unraid
#     mode http
#     server unraid <IP_Unraid>:443 ssl verify none check

# --- Home Assistant ----------------------------------------------------------
# In configuration.yaml unter http:  use_x_forwarded_for: true
#                                    trusted_proxies: [<IP_HAProxy>]
# (ohne trusted_proxies lehnt HA ab; falsch gesetzt sperrt HA sonst den Proxy selbst)
# backend be_homeassistant
#     mode http
#     option httpchk GET /manifest.json
#     timeout tunnel 1h
#     server ha <IP_HomeAssistant>:8123 check
